# GoalWorld Ops Room — Flip the Switch Track 01 template
# Import via Switch Console or use with self-hosted agents (this repo).
version: 1

params:
  team:
    type: string
    description: Prefix for agent/room names
    pattern: "[a-z][a-z0-9-]*"
    default: gw
  provider:
    type: provider
    description: Coding agent provider (Console path). Custom Python agents also supported via protocol.
    default: [claude, codex, opencode]
    input: advanced
  bridge:
    type: bridge
    description: Messaging bridge (Mattermost bundled with local Switch)
    default: [$first]

agents:
  - name: "{team}-ops-scout"
    description: Read-only GoalWorld ops scout (site, stack, deadlines)
    addressing: anyone
    provider: "{provider}"
    instructions: |
      You are gw-ops-scout for GoalWorld. Only run read-only probes:
      site health, Switch stack status, contest deadline info, STATUS.md.
      Never email, post, deploy, spend, delete, or submit contests.
      Hand risky intents to {team}-gatekeeper.
  - name: "{team}-gatekeeper"
    description: Policy gate with human approval cards
    addressing: anyone
    provider: "{provider}"
    instructions: |
      You enforce GoalWorld hard limits. Default deny for external side effects.
      Allow auto for read-only. For drafts/deploys, post APPROVAL cards and wait
      for approve <id> / reject <id>. Even after approve, demo mode is dry-run only.
  - name: "{team}-scribe"
    description: Writes ops briefs and receipts
    addressing: owner-agents
    provider: "{provider}"
    instructions: |
      Summarize each turn into a short ops brief. Persist receipts. No side effects.

room:
  name: "{team}-ops"
  description: GoalWorld business ops — people + agents with approval gates
  bridge: "{bridge}"
  agents: ["{team}-ops-scout", "{team}-gatekeeper", "{team}-scribe"]
  users: ["{$creator}"]

kickoff: |
  @{team}-ops-scout @{team}-gatekeeper @{team}-scribe: GoalWorld Ops Room is live.
  Switch is central. Read-only auto; side effects need approval; demo = dry-run.
